<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sleep Trainer</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        #light {
            position: absolute;
            top: 0;
            left: 0;
            background: #000000;
            transition: background-color 4s ease;
        }

        #menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 16px 18px;
            border-radius: 12px;
            display: none;
        }

        button {
            font-size: 1em;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 8px;
            border: none;
        }

    </style>

    <script>
        function h(h) {
            return h * 60;
        }

        const sunriseDurationMins = 30

        // Sentrale tidspunkter i minutter
        const times = {
            sunrise: h(6),
            morning: h(6) + sunriseDurationMins, //  6:30
            day: h(7) + 30,
            night: h(19)
        };
    </script>
</head>

<body>

<div id="light"></div>
<div id="menu">
    <button id="fullscreenBtn" onclick="enterFullscreen()">Fullscreen</button>
    <button id="demoBtn" onclick="toggleDemo()">Demo mode</button>
    <button id="startSunrise" onclick="startSunrise(sunriseDurationMins*60*1000)">Start soloppgang</button>
</div>

<script>
    const light = document.getElementById("light");
    const menu = document.getElementById("menu");
    const fullscreenBtn = document.getElementById("fullscreenBtn")
    const demoBtn = document.getElementById("demoBtn")


    let menuMode = false
    let demoMode = false
    let demoStep = 0
    let demoTimer = null
    let sunriseTimer = null
    let scheduleNextUpdateTimer = null


    function minutesSinceMidnight(date) {
        return date.getHours() * 60 + date.getMinutes();
    }

    function pst(decimal) {
        return (decimal * 100).toFixed(2) + '%'
    }

    function applyDay() {
        console.log("Apply day", new Date())
        document.body.style.background = "#000"
        light.style.background = "#000"
        light.style.width = "0"
        light.style.height = "0"
    }

    function applyNight() {
        console.log("Apply night", new Date())
        document.body.style.background = "#000"
        light.style.background = "#aa0000"
        light.style.width = "50%"
        light.style.height = "50%"
    }

    function applyMorning() {
        console.log("Apply morning", new Date())
        light.style.background = "#00aa00"
        light.style.width = "100%"
        light.style.height = "100%"
    }

    function applySunrise(progress) {
        if (progress > 1) progress = 1;
        console.log("Apply progress " + pst(progress), new Date())
        const size = 50 + progress * 50 // Starter animasjonen fra halve bredde og høyde (1/4 av skjermen)
        light.style.background = "#cc6600"
        light.style.width = size + "%"
        light.style.height = size + "%"
    }

    function startSunriseAnimationMs(durationMs) {
        if (sunriseTimer) clearInterval(sunriseTimer)
        console.log("Starter sunrise animasjonen", new Date())
        const steps = 150;
        const stepsDuration = durationMs / steps
        applySunrise(0);

        let frame = 0
        sunriseTimer = setInterval(() => {
            frame++

            const progress = frame / steps
            applySunrise(progress)

            if (frame >= steps) {
                console.log("Fullført sunrise animation", new Date())
                clearInterval(sunriseTimer)
                sunriseTimer = null
            }
        }, stepsDuration) // end setInterval
    }

    function startSunrise(sunriseDurationMs) {
        startSunriseAnimationMs(sunriseDurationMs);
        scheduleNextUpdateInMs(sunriseDurationMs + 1800*1000) // ingen automatikk neste 30m etter sunrise
    }

    function updateClockMode() {
        if (demoMode) return

        if (sunriseTimer) {
            clearInterval(sunriseTimer)
        }

        const now = new Date()
        const m = minutesSinceMidnight(now)

        if (m >= times.day && m < times.night) {
            applyDay()
        } else if (m >= times.night || m < times.sunrise) {
            applyNight()
        } else if (m >= times.sunrise && m < times.morning) {
            const sunriseDurationMinutes = times.morning - m;
            const sunriseDurationMs = sunriseDurationMinutes * 60 * 1000;
            startSunriseAnimationMs(sunriseDurationMs);
        } else if (m >= times.morning && m < times.day) {
            applyMorning()
        }

        scheduleNextUpdate()
    }

    function scheduleNextUpdate() {
        const now = new Date()

        const today = new Date()

        let next = null
        for (const timeInMinutes of Object.values(times)) {
            const t = new Date(today.setHours(0, timeInMinutes, 0, 0));
            if (t > now) {
                next = t
                break
            }
        }

        if (!next) {
            next = next = new Date()
            next.setDate(next.getDate() + 1)
            next.setHours(5, 0, 0, 0) // et tidspunkt før noe starter om morgenen
        }

        const delay = next - now
        scheduleNextUpdateInMs(delay)
    }

    function scheduleNextUpdateInMs(delayMs) {
        clearTimeout(scheduleNextUpdateTimer)
        scheduleNextUpdateTimer = setTimeout(updateClockMode, delayMs)
    }

    function toggleDemo() {
        demoMode = !demoMode

        if (demoMode) {
            startDemo()
        } else {
            stopDemo()
            updateClockMode()
        }

        updateMenuIndicators()
    }

    function startDemo() {
        console.log("Starter demo");
        demoStep = 0
        clearTimeout(sunriseTimer)
        runDemoStep()
    }

    function stopDemo() {
        console.log("Avslutter demo");
        clearTimeout(demoTimer)
        clearTimeout(sunriseTimer)
    }

    function runDemoStep() {
        if (!demoMode) return

        if (demoStep === 0) {
            applyDay()
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 1) {
            applyNight()
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 2) {
            startSunriseAnimationMs(4000)
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 3) {
            applyMorning()
            demoTimer = setTimeout(nextDemoStep, 5000)
        }
    }

    function nextDemoStep() {
        demoStep++
        if (demoStep > 3) demoStep = 0

        runDemoStep()
    }


    // fullscreen
    function enterFullscreen() {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen()
        }

        setTimeout(updateMenuIndicators, 200)
    }

    // meny toggle
    document.body.addEventListener("click", toggleMenu);

    function toggleMenu() {
        menuMode = !menuMode

        if (menuMode) {
            console.log("Viser meny");
            menu.style.display = "block";
        } else {
            console.log("Skjuler meny");
            menu.style.display = "none";
        }
    }

    function updateMenuIndicators() {
        if (document.fullscreenElement) {
            fullscreenBtn.textContent = "Fullscreen ✓"
        } else {
            fullscreenBtn.textContent = "Fullscreen"
        }

        if (demoMode) {
            demoBtn.textContent = "Demo mode ✓"
        } else {
            demoBtn.textContent = "Demo mode"
        }
    }

    let wakeLock = null;

    async function requestWakeLock() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log("Wake lock aktivert");

            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                console.log("Wake lock sluppet");
            });
        } catch (err) {
            console.log(`${err.name}, ${err.message}`);
        }
    }

    function refreshWakeLock() {
        return async () => {
            if (!wakeLock) {
                console.log("Refresh wake lock")
                await requestWakeLock();
            }
        };
    }

    // Må trigges av brukerhandling
    document.body.addEventListener("click", refreshWakeLock());

    // Forsøk å reaktivere hvis siden blir synlig igjen
    document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && wakeLock === null) {
            console.log("Reaktiverer wake lock etter endring i synlighet.");
            await requestWakeLock();
        }
    });

    setInterval(refreshWakeLock(), 20000 * 60); // hvert 20.min

    document.addEventListener("fullscreenchange", updateMenuIndicators)

    updateClockMode()

</script>

</body>
</html>
