<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sleep Trainer</title>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
            overflow: hidden;
            font-family: sans-serif;
        }

        #light {
            position: absolute;
            top: 0;
            left: 0;
            background: #000000;
        }

        #menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 16px 18px;
            border-radius: 12px;
            display: none;
        }

        button {
            font-size: 1em;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 8px;
            border: none;
        }

    </style>
</head>

<body>

<div id="light"></div>
<div id="menu">
    <button id="fullscreenBtn" onclick="enterFullscreen()">Fullscreen</button>
    <button id="demoBtn" onclick="toggleDemo()">Demo mode</button>
</div>

<script>
    const light = document.getElementById("light");
    const menu = document.getElementById("menu");
    const fullscreenBtn = document.getElementById("fullscreenBtn")
    const demoBtn = document.getElementById("demoBtn")

    const times = {
        sunrise: 6 * 60,
        morning: 6 * 60 + 30, //  6:30
        day: 7 * 60 + 30,
        night: 19 * 60
    };

    let menuMode = false
    let demoMode = false
    let demoStep = 0
    let demoTimer = null
    let sunriseTimer = null


    function minutesSinceMidnight(date) {
        return date.getHours() * 60 + date.getMinutes();
    }

    function applyDay() {
        document.body.style.background = "black"
        light.style.width = "0"
        light.style.height = "0"
    }

    function applyNight() {
        document.body.style.background = "black"
        light.style.background = "#aa0000"
        light.style.width = "50%"
        light.style.height = "50%"
    }

    function applyMorning() {
        document.body.style.background = "#00aa00"
        light.style.background = "#00aa00"
        light.style.width = "100%"
        light.style.height = "100%"
    }

    function applySunrise(progress) {
        if (progress > 1) progress = 1;
        const size = 50 + progress * 50 // Starter animasjonen fra halve bredde og høyde (1/4 av skjermen)
        light.style.background = "#cc6600"
        light.style.width = size + "%"
        light.style.height = size + "%"
    }


    function startSunriseAnimationMs(durationMs) {
        if (sunriseTimer) clearInterval(sunriseTimer)
        console.log("Starter sunrise animasjonen")
        const steps = 150; // Opprinnelig: 5 sekunder * 30 fps = 150 frames
        const stepsDuration = durationMs / steps
        applySunrise(0);

        let frame = 0
        sunriseTimer = setInterval(() => {
            frame++

            const progress = frame / steps

            applySunrise(progress)

            if (frame >= steps) {
                clearInterval(sunriseTimer)
                sunriseTimer = null
            }
        }, stepsDuration) // Opprinnelig: 33,3ms per frame
    }

    function updateClockMode() {
        if (demoMode) return

        const now = new Date()
        const m = minutesSinceMidnight(now)

        if (m >= times.day && m < times.night) {
            applyDay()
        } else if (m >= times.night || m < times.sunrise) {
            applyNight()
        } else if (m >= times.sunrise && m < times.morning) {
            const sunrisePlanMinutes = times.morning - times.sunrise;
            const sunriseDurationMinutes = times.morning - m;
            //const progress=(m-times.sunrise)/sunrisePlanMinutes;
            startSunriseAnimationMs(sunriseDurationMinutes*60*1000);
        } else if (m >= times.morning && m < times.day) {
            applyMorning()
        }

        scheduleNextUpdate()
    }

    function scheduleNextUpdate() {
        const now = new Date()

        const today = new Date()

        let next = null
        for (const timeInMinutes of Object.values(times)) {
            const t = new Date(today.setMinutes(timeInMinutes));
            if (t > now) {
                next = t
                break
            }
        }

        if (!next) {
            next = new Date()
            next.setDate(next.getDate() + 1)
            next.setHours(5, 0, 0, 0) // et tidspunkt før noe starter om morgenen
        }

        const delay = next - now
        setTimeout(updateClockMode, delay)
    }

    function toggleDemo() {
        demoMode = !demoMode

        if (demoMode) {
            startDemo()
        } else {
            stopDemo()
            updateClockMode()
        }

        updateMenuIndicators()
    }

    function startDemo() {
        console.log("Starter demo");
        demoStep = 0
        runDemoStep()
    }

    function stopDemo() {
        console.log("Avslutter demo");
        clearTimeout(demoTimer)
        clearTimeout(sunriseTimer)
    }

    function runDemoStep() {
        if (!demoMode) return

        if (demoStep === 0) {
            applyDay()
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 1) {
            applyNight()
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 2) {
            startSunriseAnimationMs(5000)
            demoTimer = setTimeout(nextDemoStep, 5000)
        } else if (demoStep === 3) {
            applyMorning()
            demoTimer = setTimeout(nextDemoStep, 5000)
        }
    }

    function nextDemoStep() {
        demoStep++
        if (demoStep > 3) demoStep = 0

        runDemoStep()
    }


    // fullscreen
    function enterFullscreen() {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen()
        }

        setTimeout(updateMenuIndicators, 200)
    }

    // meny toggle
    document.body.addEventListener("click", toggleMenu);

    function toggleMenu() {
        menuMode = !menuMode

        if (menuMode) {
            console.log("Viser meny");
            menu.style.display = "block";
        } else {
            console.log("Skjuler meny");
            menu.style.display = "none";
        }
    }

    function updateMenuIndicators() {
        if (document.fullscreenElement) {
            fullscreenBtn.textContent = "Fullscreen ✓"
        } else {
            fullscreenBtn.textContent = "Fullscreen"
        }

        if (demoMode) {
            demoBtn.textContent = "Demo mode ✓"
        } else {
            demoBtn.textContent = "Demo mode"
        }
    }

    let wakeLock = null;

    async function requestWakeLock() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log("Wake lock aktivert");

            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                console.log("Wake lock sluppet");
            });
        } catch (err) {
            console.log(`${err.name}, ${err.message}`);
        }
    }

    // Må trigges av brukerhandling
    document.body.addEventListener("click", async () => {
        if (!wakeLock) {
            await requestWakeLock();
        }
    });

    // Forsøk å reaktivere hvis siden blir synlig igjen
    document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && wakeLock === null) {
            console.log("Forsøker å reaktivere wake lock etter endring i synlighet.");
            await requestWakeLock();
        }
    });

    setInterval(() => {
        if (!wakeLock) {
            requestWakeLock();
        }
    }, 20000 * 60); // hvert 20.min

    document.addEventListener("fullscreenchange", updateMenuIndicators)

    updateClockMode()

</script>

</body>
</html>
